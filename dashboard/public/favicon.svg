<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <filter id="cs-glow-fav" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="cs-bg-fav" x1="16" y1="3" x2="16" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d68f" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00d68f" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Shield Background Fill -->
  <path
    d="M 16 3 L 26.5 6.5 V 15.5 C 26.5 22 16 29 16 29 C 16 29 5.5 22 5.5 15.5 V 6.5 L 16 3 Z"
    fill="url(#cs-bg-fav)"
  />

  <!-- Shield Outline with Inner Glow -->
  <path
    d="M 16 3 L 26.5 6.5 V 15.5 C 26.5 22 16 29 16 29 C 16 29 5.5 22 5.5 15.5 V 6.5 L 16 3 Z"
    stroke="#00d68f"
    stroke-width="2.2"
    stroke-miterlimit="10"
    filter="url(#cs-glow-fav)"
  />

  <!-- Optimized Crowd Flow Arcs (2 Arcs for Favicon Clarity) -->
  <path
    d="M 10.5 13.5 C 10.5 9 21.5 9 21.5 13.5"
    stroke="#00d68f"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <path
    d="M 12.5 19 C 12.5 15.5 19.5 15.5 19.5 19"
    stroke="#00d68f"
    stroke-width="2.2"
    stroke-linecap="round"
  />
</svg>