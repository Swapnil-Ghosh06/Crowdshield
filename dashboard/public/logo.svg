<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <filter id="cs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="cs-bg" x1="24" y1="4" x2="24" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d68f" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#00d68f" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Shield Background Fill -->
  <path
    d="M 24 4.5 L 39.5 9.5 V 22.5 C 39.5 32 24 43.5 24 43.5 C 24 43.5 8.5 32 8.5 22.5 V 9.5 L 24 4.5 Z"
    fill="url(#cs-bg)"
  />

  <!-- Shield Outline with Inner/Glow Filter -->
  <path
    d="M 24 4.5 L 39.5 9.5 V 22.5 C 39.5 32 24 43.5 24 43.5 C 24 43.5 8.5 32 8.5 22.5 V 9.5 L 24 4.5 Z"
    stroke="#00d68f"
    stroke-width="2"
    stroke-miterlimit="10"
    filter="url(#cs-glow)"
  />

  <!-- Stylized Crowd Flow Pattern (3 Arcs Through Gate) -->
  <path
    d="M 15 19 C 15 13 33 13 33 19"
    stroke="#00d68f"
    stroke-width="2"
    stroke-linecap="round"
  />
  <path
    d="M 18 25 C 18 20 30 20 30 25"
    stroke="#00d68f"
    stroke-width="2"
    stroke-linecap="round"
  />
  <path
    d="M 21 31 C 21 27.5 27 27.5 27 31"
    stroke="#00d68f"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>
