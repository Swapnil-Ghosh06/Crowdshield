[pytest]
addopts = --import-mode=importlib
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
# NOTE: pipeline/models.py and vision-engine/models.py share the name 'models'.
# Run each engine suite separately to avoid sys.modules collision in combined runs:
#   pytest risk-engine/tests/
#   pytest vision-engine/tests/
#   pytest pipeline/tests/
